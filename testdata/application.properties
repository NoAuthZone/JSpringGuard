# Test fixture for JSpringGuard - configuration checks.
# Deliberately insecure. Do NOT copy into a real project.

# EXPECT: every actuator endpoint exposed
management.endpoints.web.exposure.include=*

# EXPECT: shutdown endpoint reachable
management.endpoint.shutdown.enabled=true

# EXPECT: verbose security logging leaks internals
spring.security.debug=true

# EXPECT: hardcoded secret, and a trivially weak one at that
jwt.secret=123456

# EXPECT: credentials in configuration
spring.datasource.password=admin123

# EXPECT: session cookie readable by JavaScript / sent over plain HTTP
server.servlet.session.cookie.http-only=false
server.servlet.session.cookie.secure=false

# EXPECT: stack traces returned to clients
server.error.include-stacktrace=always

# EXPECT: schema recreated on every start
spring.jpa.hibernate.ddl-auto=create-drop

# EXPECT: H2 console reachable
spring.h2.console.enabled=true
